# Sitio nginx para la app de Farmacia Do Sul (pacote.treekings.com.py)
# Copiar a /etc/nginx/sites-available/ y enlazar en sites-enabled.
# Certbot agrega el bloque HTTPS (listen 443) y la redirección de HTTP automáticamente.

limit_req_zone $binary_remote_addr zone=pacote_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name pacote.treekings.com.py;

    # Frontend compilado (client/dist)
    root /var/www/appFarmaciaDoSul/client/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Login y 2FA: límite extra por IP antes de llegar a Node
    location /api/auth/ {
        limit_req zone=pacote_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/pacote-proxy.conf;
    }

    # API (Node + PM2 escuchando solo en 127.0.0.1:4000)
    location /api/ {
        include /etc/nginx/snippets/pacote-proxy.conf;
    }

    # Archivos estáticos con hash: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta la resuelve React Router
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
